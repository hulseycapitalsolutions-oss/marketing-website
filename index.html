<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hulsey Capital Solutions</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --accent-color: #d97706;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 700px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(217, 119, 6, 0.2);
            margin: 1rem;
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }
        h1 span {
            color: var(--accent-color);
        }
        .tagline {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .cta-btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }
        .cta-btn:hover {
            background-color: #b45309;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hulsey <span>Capital</span> Solutions</h1>
        <div class="tagline">Professional Asset & Capital Services</div>
        <p>We deliver trusted solutions tailored to your business goals. Connect with us to learn more about our services.</p>
        <a href="mailto:HulseyChristopher351@gmail.com" class="cta-btn">Get in Touch</a>
    </div>
</body>
</html>
